name: Publish

# Publishes the package to npm when a version tag such as v2.0.1 is pushed.
# Requires the NPM_TOKEN secret (an npm automation token) in the repository settings.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: The tag must match the version in package.json
        run: |
          if [ "v$(node -p "require('./package.json').version")" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
